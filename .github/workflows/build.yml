name: Build and test

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          # Allow feature branches to reuse their own cache on later pushes.
          cache-read-only: false

      - name: Build JARs
        run: ./gradlew --no-daemon --console=plain --max-workers=2 assemble

      - name: Validate resources
        run: python3 scripts/check_resources.py

      - name: Run checks and server GameTests
        if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master'
        run: ./gradlew --no-daemon --console=plain --max-workers=2 check runGameTestServer

      - name: Upload test reports and logs
        if: ${{ !cancelled() && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-gametest/vinum-gametest-results.xml
            run-gametest/logs/
            run-gametest/crash-reports/
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload downloadable JARs
        if: ${{ success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vinum-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = 'vinum'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        vinum_tests {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods[project.mod_id]]
        }
        testClient {
            client()
            sourceSet = sourceSets.gametest
            loadedMods = [mods[project.mod_id], mods.vinum_tests]
            gameDirectory = project.file('run-test-client')
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'vinum_tests'
            systemProperty 'vinum.clientTests', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods[project.mod_id]]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [mods[project.mod_id], mods.vinum_tests]
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// Keep integration-test code and metadata out of the distributable mod jar.
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        mod_id: mod_id,
        mod_version: mod_version,
        neo_version: neo_version,
        minecraft_version_range: minecraft_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from('LICENSE.md', 'LICENSE-WINE-PROTOTYPE.md')
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Implementation-Title': 'Project Vinum',
                        'Implementation-Version': project.version,
                        'Implementation-Vendor': 'Noah Martino')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

// Optional development add-on, never built by assemble or included in the normal mod JAR.
tasks.register('testHarnessJar', Jar) {
    dependsOn tasks.named('gametestClasses')
    archiveClassifier = 'tests'
    from sourceSets.gametest.output
}
